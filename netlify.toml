[build]
  publish = "."

# Enforce HTTPS and clean routing redirects
[[redirects]]
  from = "http://snehaidbc.netlify.app/*"
  to = "https://snehaidbc.netlify.app/:splat"
  status = 301
  force = true

# Cache static assets long-term for Core Web Vitals performance
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
